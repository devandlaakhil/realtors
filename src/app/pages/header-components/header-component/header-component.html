<mat-toolbar class="app-header">
  <!-- LEFT -->
  <div class="left-section">
    <div class="logo" (click)="backToHome()">
      <img src="images/realtors.png" alt="logo" />
      <span class="brand">Realtors</span>
    </div>
  </div>

  <!-- DESKTOP NAV -->
  <div class="nav-links">
    <button mat-button data-bs-toggle="modal" data-bs-target="#exampleModal">
      {{ Location }}
    </button>
    <button mat-button (click)="backToHome()" routerLinkActive="active-link">{{'Home' | T}}</button>
    @if (isLoggedIn) {
      <button mat-button routerLink="/dashboard" routerLinkActive="active-link">{{'Dashboard' | T}}</button>
    }
    <button mat-button routerLink="/about" routerLinkActive="active-link">{{'About' | T}}</button>
    <button mat-button routerLink="/services/home" routerLinkActive="active-link">{{'Services' | T}}</button>
    <button mat-button routerLink="/contact-us" routerLinkActive="active-link">{{'Contact' | T}}</button>
  </div>

  <span class="spacer"></span>

  <!-- RIGHT SIDE -->
  <div class="right-section desktop-actions">
    @if (isLoggedIn) {
      <button mat-button class="post-property" routerLink="/ad-post">{{'Post Property' | T}}</button>
      <button mat-button class="user-btn" [matMenuTriggerFor]="profileMenu">
        <div class="avatar">
          {{ username()[0] || 'U' }}
        </div>
        <span class="username">
          {{ username() }}
        </span>
        <mat-icon class="arrow"> expand_more </mat-icon>
      </button>
    } @else {
      <div class="auth-buttons">
        <button mat-stroked-button class="login-btn" routerLink="/login">{{'Login'|T}}</button>
        <button mat-raised-button class="register-btn" routerLink="/register">{{'Register'|T}}</button>
      </div>
    }
  </div>

  <!-- MOBILE MENU ICON -->
  <button mat-icon-button class="mobile-menu" (click)="toggleMobileMenu()">
    <mat-icon>
      {{ isMobileMenuOpen ? 'close' : 'menu' }}
    </mat-icon>
  </button>
</mat-toolbar>

<!-- MOBILE MENU -->
<div class="mobile-dropdown" *ngIf="isMobileMenuOpen">
  <div class="lang-toggle" [class.telugu]="selectedLang === 'te'" (click)="toggleLanguage()">
    <div class="slider"></div>
    <span class="label left">ENG</span>
    <span class="label right">తెలుగు</span>
  </div>
  <button mat-button data-bs-toggle="modal" data-bs-target="#exampleModal">
    {{ Location }}
  </button>
  <button mat-button (click)="backToHome()" routerLinkActive="active-link">{{'Home' | T}}</button>
  <button mat-button routerLink="/contact-us" routerLinkActive="active-link">{{'Contact'|T}}</button>

  <!-- LOGGED IN USER -->
  @if (isLoggedIn) {
    <button mat-button routerLink="/dashboard" (click)="toggleMobileMenu()">{{'Dashboard' | T}}</button>
    <button mat-button routerLink="/ad-post" (click)="toggleMobileMenu()">{{'Post Property' | T}}</button>
    <button mat-button (click)="navToProfile(); toggleMobileMenu()">{{'Profile'| T}}</button>
    <button mat-button routerLink="/services/home" (click)="toggleMobileMenu()">{{'Services' | T}}</button>
    <button mat-button (click)="logout(); toggleMobileMenu()">{{'Logout'| T}}</button>
  }
  <!-- LOGGED OUT USER -->
  @else {
    <button mat-button routerLink="/about" (click)="toggleMobileMenu()">{{'About'| T}}</button>
    <button mat-button routerLink="/services/home" (click)="toggleMobileMenu()">{{'Services'| T}}</button>
    <button mat-button routerLink="/login" (click)="toggleMobileMenu()">{{'Login'|T}}</button>
    <button mat-button routerLink="/register" (click)="toggleMobileMenu()">{{'Register'|T}}</button>
  }
</div>

<!-- PROFILE MENU -->
<mat-menu #profileMenu="matMenu" class="profile-menu">
  <div class="menu-header">
    <div class="avatar big">
      {{ username()[0] || 'U' }}
    </div>

    <div>
      <div class="menu-name">
        {{ username() || 'Guest' }}
      </div>

      <div class="menu-sub">User</div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <div class="lang-toggle" [class.telugu]="selectedLang === 'te'" (click)="toggleLanguage()">
    <div class="slider"></div>
    <span class="label left">ENG</span>
    <span class="label right">తెలుగు</span>
  </div>

  <button mat-menu-item (click)="navToProfile()">
    <mat-icon>person</mat-icon>
    <span>{{'Profile' | T}}</span>
  </button>

  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>{{'Logout' | T}}</span>
  </button>
</mat-menu>

<div
  class="modal fade popup"
  id="exampleModal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Full Address</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{ fullAddress }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
