<mat-toolbar class="app-header">

  <!-- LEFT -->
  <div class="left-section">
    <div class="logo" (click)="backToHome()">
      <img src="images/realtors.png" alt="logo" />
      <span class="brand">Realtors</span>
    </div>
  </div>

  <!-- DESKTOP NAV -->
  <div class="nav-links">

    <button mat-button>
      {{ Location }}
    </button>

    @if (isLoggedIn) {
      <button
        mat-button
        routerLink="/dashboard"
        routerLinkActive="active-link">
        Dashboard
      </button>
    }

    <button
      mat-button
      routerLink="/aboutus"
      routerLinkActive="active-link">
      About
    </button>

    <button
      mat-button
      routerLink="/service"
      routerLinkActive="active-link">
      Services
    </button>

    <button mat-button>
      Contact
    </button>

  </div>

  <span class="spacer"></span>

  <!-- RIGHT SIDE -->
  <div class="right-section desktop-actions">
    @if (isLoggedIn) {
      <button
        mat-button
        class="post-property"
        routerLink="/ad-post">
        Post Property
      </button>
      <button
        mat-button
        class="user-btn"
        [matMenuTriggerFor]="profileMenu">

       <div class="avatar">
  {{ username()[0] || 'U' }}
</div>

        <span class="username">
          {{ username() }}
        </span>

        <mat-icon class="arrow">
          expand_more
        </mat-icon>

      </button>

    } @else {

      <!-- <button
        mat-button
        class="post-property"
        routerLink="/ad-post">
        Post Property
      </button> -->

      <div class="auth-buttons">

        <button
          mat-stroked-button
          class="login-btn"
          routerLink="/login">
          Login
        </button>

        <button
          mat-raised-button
          class="register-btn"
          routerLink="/register">
          Register
        </button>

      </div>

    }

  </div>

  <!-- MOBILE MENU ICON -->
  <button
    mat-icon-button
    class="mobile-menu"
    (click)="toggleMobileMenu()">

    <mat-icon>
      {{ isMobileMenuOpen ? 'close' : 'menu' }}
    </mat-icon>

  </button>

</mat-toolbar>

<!-- MOBILE MENU -->
<!-- MOBILE MENU -->
<div
  class="mobile-dropdown"
  *ngIf="isMobileMenuOpen">

  <button mat-button>
    {{ Location }}
  </button>

  <!-- LOGGED IN USER -->
  @if (isLoggedIn) {

    <button
      mat-button
      routerLink="/dashboard"
      (click)="toggleMobileMenu()">
      Dashboard
    </button>

    <button
      mat-button
      routerLink="/ad-post"
      (click)="toggleMobileMenu()">
      Post Property
    </button>

    <button
      mat-button
      (click)="navToProfile(); toggleMobileMenu()">
      Profile
    </button>

    <button
      mat-button
      routerLink="/service"
      (click)="toggleMobileMenu()">
      Services
    </button>

    <button
      mat-button
      routerLink="/aboutus"
      (click)="toggleMobileMenu()">
      About
    </button>

    <button
      mat-button
      (click)="logout(); toggleMobileMenu()">
      Logout
    </button>

  }

  <!-- LOGGED OUT USER -->
  @else {

    <button
      mat-button
      routerLink="/aboutus"
      (click)="toggleMobileMenu()">
      About
    </button>

    <button
      mat-button
      routerLink="/service"
      (click)="toggleMobileMenu()">
      Services
    </button>

    <button
      mat-button
      routerLink="/login"
      (click)="toggleMobileMenu()">
      Login
    </button>

    <button
      mat-button
      routerLink="/register"
      (click)="toggleMobileMenu()">
      Register
    </button>

  }

</div>

<!-- PROFILE MENU -->
<mat-menu
  #profileMenu="matMenu"
  class="profile-menu">

  <div class="menu-header">

    <div class="avatar big">
  {{ username()[0] || 'U' }}
</div>

    <div>
      <div class="menu-name">
        {{ username() || 'Guest' }}
      </div>

      <div class="menu-sub">
        User
      </div>
    </div>

  </div>

  <mat-divider></mat-divider>

  <button
    mat-menu-item
    (click)="navToProfile()">

    <mat-icon>person</mat-icon>
    <span>Profile</span>

  </button>

  <button mat-menu-item>

    <mat-icon>settings</mat-icon>
    <span>Settings</span>

  </button>

  <mat-divider></mat-divider>

  <button
    mat-menu-item
    (click)="logout()">

    <mat-icon>logout</mat-icon>
    <span>Logout</span>

  </button>

</mat-menu>
