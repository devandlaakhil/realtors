<div class="dashboard-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="isMobileMenuOpen">
    <div class="sidebar-brand">
      <h2>Realtors <span>India</span></h2>
      <button class="close-menu-btn" (click)="toggleMobileMenu()">✕</button>
    </div>

    <nav class="sidebar-nav">
      <!-- <a class="nav-item" [class.active]="activeMenu === 'home'" (click)="navigateTo('home')">
        📊 {{'Dashboard' |T}}
      </a>

      <a class="nav-item" [class.active]="activeMenu === 'posts'" (click)="navigateTo('posts')">
        🏗️ {{'My Properties' | T}}
      </a> -->

      <a
        class="nav-item"
        [class.active]="activeMenu === 'services'"
        (click)="navigateTo('services')"
      >
        📥 {{'Services' | T}}
      </a>

      <a
        class="nav-item"
        [class.active]="activeMenu === 'advertisement'"
        (click)="navigateTo('advertisement')"
      >
        📢 {{'Post Advertisement'|T}}
      </a>

      <a
        class="nav-item"
        [class.active]="activeMenu === 'settings'"
        (click)="navigateTo('settings')"
      >
        ⚙️ Settings
      </a>
      <a class="nav-item" [class.active]="activeMenu === 'reports'" (click)="navigateTo('reports')">
        Reports
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content" [class.reports-active]="activeMenu === 'reports'">
    <!-- Top Navbar -->
    <header class="top-navbar">
      <button class="hamburger-btn" (click)="toggleMobileMenu()">☰</button>

      <div class="welcome-text">
        <span class="eyebrow">{{ 'Owner workspace' | T }}</span>
        <h1>{{'Namaste' | T}}, {{ username() }}</h1>
        <p>{{'Manage listings from one place.' | T}}</p>
      </div>

      <div class="profile-pill">
        <span class="verification-tag"> ✓ RERA Registered Agent </span>
      </div>
    </header>

    <section class="quick-actions">
      <!-- <button class="quick-action" [class.active]="activeMenu === 'home'" (click)="navigateTo('home')">
        <span>📊</span>
        <span>{{'Dashboard' | T}}</span>
      </button>

      <button class="quick-action" [class.active]="activeMenu === 'posts'" (click)="navigateTo('posts')">
        <span>🏠</span>
        <span>{{'My Properties' | T}}</span>
      </button> -->

      <button class="quick-action" [class.active]="activeMenu === 'services'" (click)="navigateTo('services')">
        <span>🛠️</span>
        <span>{{'Services' | T}}</span>
      </button>

      <button class="quick-action" [class.active]="activeMenu === 'advertisement'" (click)="navigateTo('advertisement')">
        <span>📢</span>
        <span>{{'Post Advertisement'|T}}</span>
      </button>
      <button class="quick-action" [class.active]="activeMenu === 'reports'" (click)="navigateTo('reports')">
        <span>Reports</span>
      </button>
    </section>

    <!-- Dynamic Screen Area -->
    <div class="dashboard-body">
      <div class="dashboard-surface">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
