<div class="dashboard-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="isMobileMenuOpen">
    <div class="sidebar-brand">
      <h2>Realtors <span>India</span></h2>
      <button class="close-menu-btn" (click)="toggleMobileMenu()">✕</button>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" [class.active]="activeMenu === 'home'" (click)="navigateTo('home')">
        📊 {{'Dashboard' |T}}
      </a>

      <a class="nav-item" [class.active]="activeMenu === 'posts'" (click)="navigateTo('posts')">
        🏗️ {{'My Properties' | T}}
      </a>

      <a
        class="nav-item"
        [class.active]="activeMenu === 'enquiries'"
        (click)="navigateTo('enquiries')"
      >
        📥 Enquiries
      </a>

      <a
        class="nav-item"
        [class.active]="activeMenu === 'settings'"
        (click)="navigateTo('settings')"
      >
        ⚙️ Settings
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <!-- Top Navbar -->
    <header class="top-navbar">
      <button class="hamburger-btn" (click)="toggleMobileMenu()">☰</button>

      <div class="welcome-text">
        <h1>{{'Namaste' | T}}, {{ username() }}</h1>
        <p>{{'Here is your real estate performance overview.' | T}}</p>
      </div>

      <div class="profile-pill">
        <span class="verification-tag"> ✓ RERA Registered Agent </span>
      </div>
    </header>

    <!-- Dynamic Screen Area -->
    <div class="dashboard-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
