<section class="ad-post-page">
  <div class="ad-post-header">
    <span class="eyebrow">Sponsored placement</span>
    <h2>Post Advertisement</h2>
    <p>Upload a banner, add a video link, or promote any social media post after a ₹2 payment.</p>
  </div>

  <form class="ad-form" [formGroup]="adForm" (ngSubmit)="submitAdvertisement()">
    <div class="field-group">
      <label>Advertisement title</label>
      <input type="text" formControlName="title" placeholder="Example: Weekend plot offer" />
    </div>

    <div class="type-grid">
      <button type="button" [class.active]="selectedType === 'photo'" (click)="onTypeChange('photo')">
        <span>Photo Banner</span>
      </button>
      <button type="button" [class.active]="selectedType === 'video'" (click)="onTypeChange('video')">
        <span>Video Link</span>
      </button>
      <button type="button" [class.active]="selectedType === 'social'" (click)="onTypeChange('social')">
        <span>Social Link</span>
      </button>
    </div>

    @if (selectedType === 'photo' || selectedType === 'video') {
      <div class="upload-box">
        <input
          id="ad-media"
          type="file"
          [accept]="selectedType === 'photo' ? 'image/*' : 'video/*'"
          (change)="onFileSelected($event)"
        />
        <label for="ad-media">
          <strong>
            {{
              selectedFileName ||
                (selectedType === 'photo' ? 'Choose photo banner' : 'Choose video file')
            }}
          </strong>
          <span>
            {{
              selectedType === 'photo'
                ? 'Recommended banner image for the home advertisement space.'
                : 'Upload a video file or paste a video URL below.'
            }}
          </span>
        </label>
      </div>
    }

    @if (selectedType === 'video' || selectedType === 'social') {
      <div class="field-group">
        <label>{{ selectedType === 'video' ? 'Video URL' : 'Social media URL' }}</label>
        <input type="url" formControlName="targetLink" placeholder="https://..." />
      </div>
    }

    <div class="field-group">
      <label>Notes</label>
      <textarea formControlName="notes" rows="3" placeholder="Offer details, phone number, or campaign note"></textarea>
    </div>

    <div class="payment-panel">
      <div>
        <span>Advertisement fee</span>
        <strong>₹{{ adPrice }}</strong>
      </div>
      <button type="button" class="pay-btn" [disabled]="paymentDone" (click)="payForAdvertisement()">
        {{ paymentDone ? 'Paid' : 'Pay ₹2' }}
      </button>
    </div>

    <button type="submit" class="submit-btn" [disabled]="!paymentDone || isPosting">
      Post Advertisement
    </button>
  </form>
</section>
