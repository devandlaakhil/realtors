<div class="map-wrapper">
  <google-map
    [center]="center"
    [zoom]="15"
    width="100%"
    height="600px"
    (mapClick)="onMapClick($event)"
  >
    <!-- Selected Location -->
    <map-marker
      *ngIf="selectedLocation && dragble"
      [position]="selectedLocation"
      [options]="{
        draggable: true,
      }"
      (mapDragend)="markerDragged($event)"
    >
    </map-marker>

    <!-- Service Markers -->
    <map-marker
      *ngFor="let t of data"
      #marker="mapMarker"
      [position]="{
        lat: +(t.location?.coordinates?.[1] ?? t.lat),
        lng: +(t.location?.coordinates?.[0] ?? t.lng),
      }"
      (mapClick)="openInfo(marker, t)"
    >
    </map-marker>

    <map-info-window>
      <div *ngIf="selectedItem" class="info-window">
        <img
          [src]="
            selectedItem?.images?.[0]?.url ||
            selectedItem?.image?.[0]?.url ||
            selectedItem?.image ||
            '/images/avatar.png'
          "
          width="120"
        />

        <h4>{{ selectedItem?.name }}</h4>
        <p>₹{{ selectedItem?.price }}/hour</p>
        <p>{{ selectedItem?.category }}</p>
      </div>
    </map-info-window>
  </google-map>
</div>
