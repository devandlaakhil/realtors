<div class="skeleton-overlay" *ngIf="loading$ | async" aria-busy="true" aria-label="Loading content">
  <div class="skeleton-page" aria-hidden="true">
    <div class="skeleton-heading skeleton-shimmer"></div>
    <div class="skeleton-subheading skeleton-shimmer"></div>
    <div class="skeleton-grid">
      <div class="skeleton-card" *ngFor="let item of skeletonCards">
        <div class="skeleton-image skeleton-shimmer"></div>
        <div class="skeleton-line skeleton-line--wide skeleton-shimmer"></div>
        <div class="skeleton-line skeleton-line--medium skeleton-shimmer"></div>
        <div class="skeleton-line skeleton-line--short skeleton-shimmer"></div>
      </div>
    </div>
  </div>
</div>
